import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { localProps.load(it) }
def signingProps = new Properties()
if (rootProject.file('.streamwise-signing.properties').exists()) rootProject.file('.streamwise-signing.properties').withInputStream { signingProps.load(it) }
def tmdbKey = System.getenv('TMDB_API_KEY') ?: localProps.getProperty('tmdb.api.key', '')

android {
    namespace 'it.dueffe.streamwise'
    compileSdk 36
    buildFeatures { buildConfig true; compose true }

    defaultConfig {
        def updateRepo = providers.gradleProperty('updateRepository').getOrElse('carellice/dueffe-streamwise')
        if (!(updateRepo ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) throw new GradleException('updateRepository must be owner/repo')
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"' + updateRepo + '"' 
        applicationId 'it.dueffe.streamwise'
        testInstrumentationRunner 'it.dueffe.streamwise.StreamWiseInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode versionProps.getProperty('VERSION_CODE', '1').toInteger()
        versionName versionProps.getProperty('VERSION_NAME', '1.0.0')
        buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbKey.replace('"', '\\"') + '"'
    }

    if (!signingProps.isEmpty()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingProps.isEmpty() ? signingConfigs.debug : signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.work:work-runtime:2.10.5'
    def composeBom = platform('androidx.compose:compose-bom:2025.09.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.4.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
